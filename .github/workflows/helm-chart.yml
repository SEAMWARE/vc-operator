name: Helm Chart

on:
  workflow_call:
    inputs:
      app_version:
        description: >-
          Operator image version this chart deploys. Written to the chart's
          appVersion so the chart always tracks the released image.
        required: true
        type: string
      bump:
        description: semver level (major|minor|patch) to bump the chart version by.
        required: true
        type: string
      pre_release:
        type: boolean
        default: false
      pr_number:
        type: string
        default: ""
    secrets:
      QUAY_USERNAME:
        required: true
      QUAY_PASSWORD:
        required: true

env:
  OCI_REPO: oci://quay.io/seamware/helm-charts
  CHART_DIR: charts/vc-operator
  CHART_TAG_PREFIX: chart-v

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The chart is published on every release, whether or not a file under
      # charts/ changed: appVersion tracks the operator image, so a chart that
      # is not republished keeps pointing consumers at a stale image.
      - name: Compute chart version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "${CHART_TAG_PREFIX}*" --sort=-version:refname | head -1)
          if [[ -z "$LATEST_TAG" ]]; then
            CURRENT=$(grep '^version:' "${{ env.CHART_DIR }}/Chart.yaml" | awk '{print $2}')
          else
            CURRENT="${LATEST_TAG#${CHART_TAG_PREFIX}}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *)
              echo "::error::bump must be major, minor or patch, got '${{ inputs.bump }}'"
              exit 1
              ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if [[ "${{ inputs.pre_release }}" == "true" ]]; then
            VERSION="${VERSION}-PRE-${{ inputs.pr_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to OCI registry
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | helm registry login quay.io \
            --username "${{ secrets.QUAY_USERNAME }}" \
            --password-stdin

      - name: Check if version already exists
        if: inputs.pre_release == false
        id: exists
        run: |
          if helm show chart "${{ env.OCI_REPO }}/vc-operator" \
              --version "${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package and push chart
        if: inputs.pre_release || steps.exists.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version:.*/version: ${VERSION}/" "${{ env.CHART_DIR }}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${{ inputs.app_version }}\"/" "${{ env.CHART_DIR }}/Chart.yaml"
          helm package "${{ env.CHART_DIR }}"
          helm push "vc-operator-${VERSION}.tgz" "${{ env.OCI_REPO }}"

      - name: Create chart version tag
        if: inputs.pre_release == false && steps.exists.outputs.exists != 'true'
        run: |
          git tag "${CHART_TAG_PREFIX}${{ steps.version.outputs.version }}"
          git push origin "${CHART_TAG_PREFIX}${{ steps.version.outputs.version }}"
