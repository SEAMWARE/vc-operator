{{- /*
The CRDs are installed from the crds/ folder, which Helm applies before any template, so
that resources of these kinds can be part of the same release (e.g. when a parent chart
creates them). Helm neither upgrades nor deletes what is in crds/.

Chart versions up to 0.1.5 rendered the CRDs from this template instead, so the releases
installed with them own the CRDs. If the template simply went away, upgrading such a
release would delete the CRDs and every CredentialIssuer and VerifiableCredentialRequest
with them. For those releases only, the CRDs keep being rendered here, marked to be kept by
Helm: they survive the upgrade, stay up to date with the chart, and are left in place if
the release is uninstalled.
*/}}
{{- range $path, $_ := .Files.Glob "crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $live := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $crd.metadata.name }}
{{- $owner := dig "metadata" "annotations" "meta.helm.sh/release-name" "" ($live | default dict) }}
{{- $ownerNamespace := dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" ($live | default dict) }}
{{- if and (eq $owner $.Release.Name) (eq $ownerNamespace $.Release.Namespace) }}
{{- $_ := set $crd.metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") ($crd.metadata.annotations | default dict)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
